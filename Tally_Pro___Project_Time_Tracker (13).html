{const lfs=e=>{const t=e.target,n=t.dataset.lf,v=t.value,id=t.id,pos=t.selectionStart;if(n==='day')F.days=v===''?[]:[+v];else F[n]=v;pgi=0;render();if(t.tagName==='INPUT'){const i=$(id);if(i){i.focus();try{i.setSelectionRange(pos,pos)}catch(x){}}}if(t.dataset&&t.dataset.cb)cbOpen(n,false)};

function ensure(name,cat){name=(name||'').trim()||'General';let p=S.projects.find(x=>x.name.toLowerCase()===name.toLowerCase());if(!p){p={id:uid(),name,cats:[]};S.projects.push(p)}cat=(cat||'').trim()||'Uncategorized';const ex=p.cats.find(c=>c.toLowerCase()===cat.toLowerCase());if(ex)cat=ex;else if(cat!=='Uncategorized')p.cats.push(cat);return[p,cat]}
function stop(){const r=S.running,now=new Date(),st=new Date(r.start),same=dk(now)===dk(st);

  saveFile(`time-report-${st}.pdf`,d.output('blob'))}}
